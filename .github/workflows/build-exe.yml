name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Unit tests - legacy and updated programs
        run: python -m unittest discover -s tests -v

      - name: Smoke test Python launch and diagnostic modes
        shell: pwsh
        run: |
          python -u bulk_delete_agent_targets.py --diagnose --target-dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u bulk_delete_agent_targets.py --mode check --target-dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u bulk_delete_agent_targets.py --inspect-protection --target-dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Force a legacy code page to reproduce the previous Korean-output crash.
          $env:PYTHONIOENCODING = "cp1252"
          python -u bulk_delete_agent_targets.py --diagnose --target-dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:\PYTHONIOENCODING

      - name: Smoke test Windows CMD launcher
        shell: pwsh
        run: |
          cmd.exe /d /c run-notebook-deleter.cmd --diagnose --target-dir .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test verified Python preview
        shell: pwsh
        run: |
          python -u verified_delete.py --target-dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONIOENCODING = "cp1252"
          python -u verified_delete.py --target-dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:\PYTHONIOENCODING

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile --console --name inc-notebook-deleter verified_delete.py

      - name: Smoke test packaged EXE launch
        shell: pwsh
        run: |
          & ".\dist\inc-notebook-deleter.exe" --target-dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONIOENCODING = "cp1252"
          & ".\dist\inc-notebook-deleter.exe" --target-dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:\PYTHONIOENCODING

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: inc-notebook-deleter-windows-exe
          path: |
            dist/inc-notebook-deleter.exe
            bulk_delete_agent_targets.py
            run-diagnostics.cmd
            run-notebook-deleter.cmd
            verified_delete.py
            removal_assessment.py
            run_verified_delete.cmd
            analyze_reference.cmd
            analyze_protection.cmd
          if-no-files-found: error
